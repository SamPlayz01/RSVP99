<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP99 | Sign in</title>
<meta name="description" content="Sign in to RSVP99 with your username.">
<meta name="theme-color" content="#f3eee0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 90'%3E%3Crect x='6' y='6' width='108' height='78' rx='24' fill='%232e4d34'/%3E%3Cpath d='M18 22l42 24 42-24' fill='none' stroke='%23f9f2e0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ---------- tokens (same as index.html) ---------- */
:root{
  --page:#f3eee0; --surface:#fbf8ef; --line:rgba(28,42,33,.14);
  --ink:#1c2a21; --mute:#5d6b61;
  --g:#4e8a67; --g-deep:#3b6f50; --g-soft:#6aa585;
  --butter:#f4e3a6; --sage:#d3e4d2; --warn:#c2603a; --ok:#2f7a4f;
  --paper:#fffdf6;
  --logo-body:#2e4d34; --logo-ink:#f9f2e0; --logo-cheek:#ad8659;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme="dark"]{
  --page:#141915; --surface:#1d231f; --line:rgba(255,255,255,.14);
  --ink:#eef2ec; --mute:#9aa89f;
  --g:#5a9b76; --g-deep:#427a5a; --g-soft:#79b494;
  --butter:#4a4224; --sage:#27382b; --warn:#e08a63; --ok:#7fcf9f;
  --logo-body:#3b6f50; --logo-ink:#f9f2e0; --logo-cheek:#ad8659;
}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@property --q{syntax:'<number>';inherits:true;initial-value:0}

*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{height:100%}
body{
  font:16px/1.55 var(--sans);color:var(--ink);background:var(--page);
  min-height:100%;
  padding-top:calc(64px + env(safe-area-inset-top,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.1;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
a{color:inherit}

/* ---------- header ---------- */
.bar{
  position:fixed;inset:0 0 auto 0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;
  background:var(--page);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font:700 24px var(--serif);text-decoration:none}
.brand b{color:var(--g)}
.logo{width:40px;height:30px;display:block}
.logo .lb{fill:var(--logo-body)}
.logo .li{fill:none;stroke:var(--logo-ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.logo .lf{fill:var(--logo-ink)}
.logo .lp{fill:var(--logo-body)}
.logo .lc{fill:var(--logo-cheek)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;grid-area:1/1}
.icon .moon{display:none}
[data-theme="dark"] .icon .sun{display:none}
[data-theme="dark"] .icon .moon{display:block}

/* ---------- layout ---------- */
main{max-width:440px;margin:0 auto;padding:28px 20px 60px}
.stage{display:grid;place-items:center;min-height:250px;padding-top:10px}

/* ---------- 3D envelope (same build as index.html) ---------- */
.env3d{
  position:relative;width:260px;height:174px;max-width:100%;perspective:1100px;
  transform:translateY(calc(var(--p) * 44px));
  transition:--p .6s cubic-bezier(.3,.7,.2,1),--q .7s cubic-bezier(.3,.7,.2,1);
}
.env3d.open{--p:1}
.env3d.sent{--p:1;--q:1}
.envelope{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transform:rotateX(calc(20deg - var(--p) * 14deg)) rotateY(calc(-24deg + var(--p) * 24deg)) rotateZ(calc(-3deg + var(--p) * 3deg));
  will-change:transform;
}
.envelope>*{position:absolute;left:0;top:0;width:100%;height:100%}
.env-back{background:var(--g-deep);border-radius:8px}
.env-letter{
  left:7%;width:86%;top:8%;height:86%;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 18px;
  background:var(--paper);color:#1c2a21;border-radius:6px;
  transform:translateZ(2px) translateY(calc(var(--q) * -104px));
}
.env-letter b{font:700 18px/1.15 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env-letter span{font-size:14px}
.env-letter em{font-style:normal;font-size:12px;margin-top:4px;padding-top:6px;border-top:1px solid rgba(28,42,33,.18);opacity:.7}
.env-front{background:var(--g);border-radius:8px;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);transform:translateZ(4px)}
.env-face{transform:translateZ(5px);pointer-events:none;overflow:visible}
.pupil{transition:transform .12s}
.eye ellipse,.eye circle{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.env3d.shy .eye ellipse{transform:scaleY(.12)}
.env3d.shy .eye circle{transform:scaleY(0)}
.env-flap{height:52%;transform-origin:50% 0;transform-style:preserve-3d;transform:translateZ(calc(8px - var(--p) * 14px)) rotateX(calc(var(--p) * -180deg))}
.env-flap i{position:absolute;inset:0;display:block;clip-path:polygon(0 0,100% 0,50% 100%);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.env-flap .f{background:var(--g);filter:brightness(1.08)}
.env-flap .b{background:var(--g-soft);transform:rotateY(180deg)}
.env-shadow{position:absolute;left:8%;right:8%;bottom:-24px;height:16px;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);transform:scaleX(calc(1 - var(--p) * .12));opacity:calc(.9 - var(--p) * .25)}

/* ---------- card ---------- */
.card{margin-top:34px;padding:24px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.card h1{font-size:clamp(28px,6vw,36px);margin-bottom:6px}
.sub{color:var(--mute);font-size:15px;margin-bottom:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--page);margin-bottom:20px}
.tabs button{padding:8px;border-radius:999px;font-weight:600;font-size:15px;color:var(--mute);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--g);color:#fff}

label{display:block;font-size:14px;font-weight:600;margin-bottom:14px}
.field{position:relative;margin-top:5px}
.field input{
  display:block;width:100%;padding:11px 44px 11px 42px;border-radius:12px;
  border:1px solid var(--line);background:var(--page);font-weight:400;
}
.field input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 28%,transparent)}
.field .lead{position:absolute;left:13px;top:50%;margin-top:-9px;color:var(--mute);pointer-events:none}
.field input:focus ~ .lead{color:var(--g)}
.hint{display:block;margin-top:5px;font-size:13px;font-weight:400;color:var(--mute)}

/* ---------- css icons (no images, no svg) ---------- */
.ico{position:relative;display:block;width:18px;height:18px;flex:none}
.ico::before,.ico::after{content:"";position:absolute;box-sizing:border-box}
.ico.user::before{width:8px;height:8px;left:5px;top:1px;border:1.8px solid currentColor;border-radius:50%}
.ico.user::after{width:14px;height:7px;left:2px;bottom:0;border:1.8px solid currentColor;border-bottom:0;border-radius:8px 8px 0 0}
.ico.lock::before{width:14px;height:9px;left:2px;bottom:0;border:1.8px solid currentColor;border-radius:3px}
.ico.lock::after{width:8px;height:8px;left:5px;top:0;border:1.8px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0}
.ico.eye::before{width:18px;height:11px;left:0;top:3.5px;border:1.8px solid currentColor;border-radius:50%}
.ico.eye::after{width:5px;height:5px;left:6.5px;top:6.5px;background:currentColor;border-radius:50%}
.ico.eye s{display:none;position:absolute;left:-1px;top:8px;width:20px;height:2px;background:currentColor;border-radius:2px;transform:rotate(-45deg);box-shadow:0 0 0 1.5px var(--page)}
.peek{position:absolute;right:6px;top:50%;margin-top:-16px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--mute)}
.peek:hover{color:var(--ink)}
.peek[aria-pressed="true"] .ico.eye s{display:block}
.ico.out::before{width:9px;height:14px;left:1px;top:2px;border:1.8px solid currentColor;border-right:0;border-radius:3px 0 0 3px}
.ico.out::after{width:9px;height:9px;left:7px;top:4.5px;border:solid currentColor;border-width:1.8px 1.8px 0 0;transform:rotate(45deg) scale(.7);transform-origin:center}

/* ---------- buttons + messages ---------- */
.cta,.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;border-radius:999px;font-weight:600;font-size:17px;border:1px solid transparent;transition:background .15s}
.cta{background:var(--g);color:#fff}
.cta:hover{background:var(--g-deep)}
.cta[disabled]{opacity:.7;cursor:wait}
.ghost{border-color:var(--line);background:var(--page)}
.ghost:hover{border-color:var(--g)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.cta[disabled] .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin:0 0 14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--page)}
.msg::before{content:"";flex:none;width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--warn)}
.msg.good::before{background:var(--ok)}
.foot{margin-top:18px;color:var(--mute);font-size:14px;text-align:center}
.foot button{text-decoration:underline;font-weight:600;color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.who{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--sage);margin-bottom:16px}
.who .av{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 20px var(--serif)}
.who b{display:block;font:700 20px var(--serif)}
.who span{font-size:14px;color:var(--mute)}

@media (max-width:560px){
  .card{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .envelope{transform:rotateX(6deg)}
}
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="index.html" aria-label="RSVP99 home">
    <!-- logo: swaps colours with the theme (light + dark) -->
    <svg class="logo" viewBox="0 0 120 90" aria-hidden="true">
      <rect class="lb" x="4" y="4" width="112" height="82" rx="26"/>
      <path class="li" d="M16 20l44 25 44-25"/>
      <path class="li" d="M26 12q10-4 20-4" style="stroke-width:3"/>
      <ellipse class="lf" cx="43" cy="58" rx="9" ry="11"/><circle class="lp" cx="43" cy="59" r="4.5"/>
      <ellipse class="lf" cx="77" cy="58" rx="9" ry="11"/><circle class="lp" cx="77" cy="59" r="4.5"/>
      <circle class="lc" cx="25" cy="70" r="6"/><circle class="lc" cx="95" cy="70" r="6"/>
      <path class="li" d="M53 72q7 6 14 0" style="stroke-width:3"/>
    </svg>
    <span>RSVP<b>99</b></span>
  </a>
  <button class="icon" id="themeBtn" aria-label="Switch between light and dark">
    <svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<main>
  <div class="stage" aria-hidden="true">
    <div class="env3d" id="env3d">
      <div class="envelope">
        <div class="env-back"></div>
        <div class="env-letter"><b id="letterName">Welcome back</b><span id="letterSub">Pick up where you left off</span><em id="letterEm">Sign in to open</em></div>
        <div class="env-front"></div>
        <svg class="env-face" viewBox="0 0 300 200">
          <path d="M0 200L150 104M300 200L150 104" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
          <g class="eye"><ellipse cx="115" cy="146" rx="12" ry="15" fill="#fff"/><circle class="pupil" cx="115" cy="148" r="6" fill="#1c2a21"/></g>
          <g class="eye"><ellipse cx="185" cy="146" rx="12" ry="15" fill="#fff"/><circle class="pupil" cx="185" cy="148" r="6" fill="#1c2a21"/></g>
          <path d="M138 174q12 10 24 0" fill="none" stroke="#1c2a21" stroke-width="4" stroke-linecap="round"/>
          <circle cx="88" cy="168" r="7" fill="#f2a65a" opacity=".55"/><circle cx="212" cy="168" r="7" fill="#f2a65a" opacity=".55"/>
        </svg>
        <div class="env-flap"><i class="f"></i><i class="b"></i></div>
      </div>
      <div class="env-shadow"></div>
    </div>
  </div>

  <section class="card" id="card">
    <!-- signed out -->
    <div id="auth">
      <h1 id="title">Welcome back</h1>
      <p class="sub" id="sub">Sign in with your username.</p>

      <div class="tabs" role="tablist">
        <button role="tab" id="tabIn" aria-selected="true" type="button">Sign in</button>
        <button role="tab" id="tabUp" aria-selected="false" type="button">Create account</button>
      </div>

      <div class="msg" id="msg" role="alert" hidden></div>

      <form id="form" novalidate autocomplete="on">
        <label>Username
          <span class="field">
            <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required placeholder="nora_k">
            <i class="ico user lead"></i>
          </span>
          <span class="hint" id="userHint" hidden>3 to 20 characters: letters, numbers, dot or underscore.</span>
        </label>
        <label>Password
          <span class="field">
            <input id="pass" name="password" type="password" autocomplete="current-password" maxlength="72" required placeholder="At least 8 characters">
            <i class="ico lock lead"></i>
            <button class="peek" id="peek" type="button" aria-label="Show password" aria-pressed="false"><i class="ico eye"><s></s></i></button>
          </span>
        </label>
        <label id="confWrap" hidden>Confirm password
          <span class="field">
            <input id="conf" name="confirm" type="password" autocomplete="new-password" maxlength="72" placeholder="Type it again">
            <i class="ico lock lead"></i>
          </span>
        </label>
        <button class="cta" id="go" type="submit"><i class="spin"></i><span id="goLbl">Sign in</span></button>
      </form>

      <p class="foot" id="foot">New here? <button type="button" id="swap">Create an account</button></p>
    </div>

    <!-- signed in -->
    <div id="inside" hidden>
      <h1>You're in</h1>
      <p class="sub">Signed in on this device.</p>
      <div class="who"><div class="av" id="av">N</div><div><b id="who">nora_k</b><span>Your RSVP99 username</span></div></div>
      <div class="row" style="display:grid;gap:10px">
        <a class="cta" href="index.html" style="text-decoration:none">Go to your events</a>
        <button class="ghost" id="out" type="button"><i class="ico out"></i>Sign out</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
'use strict';

/* ================= Supabase config ================= */
var SUPABASE_URL = 'https://unhdyuabhupccxpxvvhd.supabase.co';
var SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';   // <- paste your anon (public) key here
/* =================================================== */

var $=function(s){return document.querySelector(s)};
var TOKEN_KEY='rsvp99.session';
var mode='in';

/* ---------- theme: shares the setting with index.html ---------- */
var APP_KEY='rsvp99.v1';
function readTheme(){
  try{var d=JSON.parse(localStorage.getItem(APP_KEY));if(d&&d.theme)return d.theme}catch(e){}
  return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  $('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#141915':'#f3eee0');
  try{
    var d=JSON.parse(localStorage.getItem(APP_KEY))||{events:[]};
    d.theme=t;localStorage.setItem(APP_KEY,JSON.stringify(d));
  }catch(e){}
}
setTheme(readTheme());
$('#themeBtn').addEventListener('click',function(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});

/* ---------- envelope reactions ---------- */
var env=$('#env3d');
function peekOpen(on){if(!env.classList.contains('sent'))env.classList.toggle('open',on)}
['#user','#pass','#conf'].forEach(function(s){
  var el=$(s);
  el.addEventListener('focus',function(){peekOpen(true)});
  el.addEventListener('blur',function(){
    setTimeout(function(){
      if(!document.activeElement||!document.activeElement.closest('form')){peekOpen(false);env.classList.remove('shy')}
    },60);
  });
});
function updateShy(){
  var a=document.activeElement,pw=a&&(a.id==='pass'||a.id==='conf');
  env.classList.toggle('shy',!!pw&&$('#peek').getAttribute('aria-pressed')!=='true');
}
document.addEventListener('focusin',updateShy);

addEventListener('pointermove',function(x){
  document.querySelectorAll('.eye').forEach(function(g){
    var r=g.getBoundingClientRect();if(!r.width)return;
    var dx=x.clientX-(r.left+r.width/2),dy=x.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(4,d/40);
    var p=g.querySelector('.pupil');
    if(p)p.style.transform='translate('+(dx/d*k).toFixed(2)+'px,'+(dy/d*k).toFixed(2)+'px)';
  });
},{passive:true});

/* ---------- sign in / create account switch ---------- */
function setMode(m){
  mode=m;
  var up=m==='up';
  $('#tabIn').setAttribute('aria-selected',String(!up));
  $('#tabUp').setAttribute('aria-selected',String(up));
  $('#title').textContent=up?'Make your account':'Welcome back';
  $('#sub').textContent=up?'Pick a username. No email needed.':'Sign in with your username.';
  $('#goLbl').textContent=up?'Create account':'Sign in';
  $('#confWrap').hidden=!up;
  $('#userHint').hidden=!up;
  $('#pass').autocomplete=up?'new-password':'current-password';
  $('#foot').innerHTML=up?'Already have an account? <button type="button" id="swap">Sign in</button>':'New here? <button type="button" id="swap">Create an account</button>';
  $('#letterName').textContent=up?'Welcome':'Welcome back';
  $('#letterSub').textContent=up?'Let\u2019s set you up':'Pick up where you left off';
  $('#letterEm').textContent=up?'Create an account to open':'Sign in to open';
  say('');
}
$('#tabIn').addEventListener('click',function(){setMode('in')});
$('#tabUp').addEventListener('click',function(){setMode('up')});
$('#foot').addEventListener('click',function(e){if(e.target.id==='swap')setMode(mode==='in'?'up':'in')});

$('#peek').addEventListener('click',function(){
  var b=this,on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',String(on));
  b.setAttribute('aria-label',on?'Hide password':'Show password');
  $('#pass').type=on?'text':'password';
  if($('#conf'))$('#conf').type=on?'text':'password';
  updateShy();
});

function say(t,good){
  var m=$('#msg');
  if(!t){m.hidden=true;return}
  m.textContent=t;m.className='msg'+(good?' good':'');m.hidden=false;
}
function busy(on){$('#go').disabled=on}

/* ---------- Supabase calls (username + password, no emails) ---------- */
function rpc(name,args){
  if(!SUPABASE_KEY||SUPABASE_KEY==='YOUR_SUPABASE_ANON_KEY'){
    return Promise.reject(new Error('setup'));
  }
  return fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    body:JSON.stringify(args)
  }).then(function(r){
    if(!r.ok)throw new Error('http');
    return r.json();
  });
}
var ERR={
  bad_username:'Usernames use 3 to 20 letters, numbers, dots or underscores.',
  bad_password:'Passwords need at least 8 characters.',
  username_taken:'That username is taken. Try another one.',
  invalid_credentials:'Username or password is wrong.',
  locked:'Too many tries. Wait 10 minutes and try again.'
};
function fail(e){
  var m=e&&e.message;
  say(m==='setup'?'Add your Supabase anon key in login.html to connect.':
      m==='http'?'Could not reach the server. Check the SQL setup and your key.':
      'Something went wrong. Please try again.');
  $('#card').classList.remove('shake');void $('#card').offsetWidth;$('#card').classList.add('shake');
}

$('#form').addEventListener('submit',function(e){
  e.preventDefault();
  var u=$('#user').value.trim().toLowerCase(),p=$('#pass').value;
  say('');
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){say(ERR.bad_username);$('#user').focus();return}
  if(p.length<8){say(ERR.bad_password);$('#pass').focus();return}
  if(mode==='up'&&p!==$('#conf').value){say('The two passwords do not match.');$('#conf').focus();return}
  busy(true);
  rpc(mode==='up'?'signup_user':'login_user',{p_username:u,p_password:p}).then(function(r){
    busy(false);
    if(!r||!r.ok){say(ERR[r&&r.error]||'Something went wrong.');return}
    try{localStorage.setItem(TOKEN_KEY,r.token)}catch(x){}
    $('#pass').value='';$('#conf').value='';
    enter(r.username,true);
  }).catch(function(x){busy(false);fail(x)});
});

/* ---------- signed-in state ---------- */
function enter(name,animate){
  $('#auth').hidden=true;$('#inside').hidden=false;
  $('#who').textContent=name;$('#av').textContent=name.charAt(0).toUpperCase();
  $('#letterName').textContent='Hi, '+name;
  $('#letterSub').textContent='You are signed in';
  $('#letterEm').textContent='Welcome to RSVP99';
  env.classList.remove('shy');
  env.classList.add('open');
  if(animate){setTimeout(function(){env.classList.add('sent')},350)}else env.classList.add('sent');
}
$('#out').addEventListener('click',function(){
  var t=null;try{t=localStorage.getItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY)}catch(x){}
  if(t)rpc('logout_user',{p_token:t}).catch(function(){});
  env.classList.remove('sent','open');
  $('#inside').hidden=true;$('#auth').hidden=false;
  setMode('in');$('#user').value='';
});

/* ---------- restore a saved session ---------- */
(function(){
  var t=null;try{t=localStorage.getItem(TOKEN_KEY)}catch(x){}
  if(!t)return;
  rpc('get_session',{p_token:t}).then(function(r){
    if(r&&r.ok)enter(r.username,false);
    else try{localStorage.removeItem(TOKEN_KEY)}catch(x){}
  }).catch(function(){});
})();
})();
</script>
