<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP99</title>
<meta name="theme-color" content="#f3eee0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar glass" id="bar">
  <a class="brand" href="#" data-act="tab" data-v="events">RSVP<b>99</b></a>
  <nav class="tabs" id="tabs" aria-label="Main menu">
    <span class="pill" id="pill"></span>
    <button data-act="tab" data-v="events" class="on">Events</button>
    <button data-act="tab" data-v="calendar">Calendar</button>
    <button data-act="tab" data-v="guests">Guests</button>
    <button data-act="tab" data-v="stats">Insights</button>
  </nav>
  <div class="tools">
    <button class="icon" id="themeBtn" data-act="theme" aria-label="Switch light or dark mode">
      <svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="cta" data-act="new">New event</button>
  </div>
</header>

<main id="app">
  <section class="view" id="v-events"></section>
  <section class="view" id="v-calendar" hidden></section>
  <section class="view" id="v-guests" hidden></section>
  <section class="view" id="v-stats" hidden></section>
  <section class="view share" id="v-share" hidden></section>
</main>

<dialog id="formDlg" class="glass sheet">
  <form id="evForm" method="dialog">
    <h2 id="formTitle">New event</h2>
    <label>Name<input name="name" required maxlength="80" placeholder="Rooftop dinner"></label>
    <div class="two">
      <label>Date<input type="date" name="date" required></label>
      <label>Time<input type="time" name="time"></label>
    </div>
    <label>Location<input name="loc" maxlength="100" placeholder="Where is it?"></label>
    <label>Details<textarea name="desc" rows="3" maxlength="400" placeholder="Dress code, parking, what to bring"></textarea></label>
    <label>Cover image<input type="file" name="cover" accept="image/*"></label>
    <div class="row end">
      <button type="button" class="ghost" data-act="closeForm">Cancel</button>
      <button class="cta" type="submit">Save event</button>
    </div>
  </form>
</dialog>

<dialog id="detail" class="glass sheet wide"></dialog>
<div id="toast" class="glass" role="status"></div>
<script src="script.js"></script>
</body>
</html>
